[package]
name = "hoopline"
version = "0.1.0"
edition = "2024"

[features]
# Enables a fixed wall clock only in local scenario-test builds.
scenario-tests = []

[dependencies]
axum = "0.8"
askama = "0.15"
tokio = { version = "1.49", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
chrono = { version = "0.4", default-features = true }
chrono-tz = "0.10"
subtle = "2.6"
url = "2"
base64 = "0.22"
sha2 = "0.10"
p256 = "0.13"
getrandom = "0.3"
web-push = { version = "0.11.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form"] }
tempfile = "3"
proptest = "1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
