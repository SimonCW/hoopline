<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"includeIndicatorStyles": false, "timeout": 15000}'>
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link href="/assets/app.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/name-search.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" class="app-shell" tabindex="-1">
        <div id="global-error-banner" class="request-error" role="alert" tabindex="-1" hidden></div>
        <p id="announcements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="booking-request-status" class="request-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        <noscript><p class="request-error">Enable JavaScript to select your name and manage bookings.</p></noscript>
        {% block content %}{% endblock %}
        <footer>Hoopline · Fair queues. More basketball.</footer>
    </main>
</body>
</html>
