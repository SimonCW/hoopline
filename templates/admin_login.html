{% extends "base.html" %}
{% block content %}
<section class="card welcome-card" aria-labelledby="admin-login-title">
    <h1 id="admin-login-title">Admin login</h1>
    <p>Enter the admin password to open the admin UI as {{ user_name }}.</p>
    {% if !error.is_empty() %}<p role="alert">{{ error }}</p>{% endif %}
    <form action="/admin/login" method="post" class="identity-form">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary">Enter admin UI</button>
    </form>
    <a href="/slots">Back to games</a>
</section>
{% endblock %}
