<section
    id="slots-content"
    class="max-w-7xl w-full space-y-4"
    hx-get="/slots/fragment"
    hx-trigger="user-changed from:body"
    hx-swap="outerHTML"
>
    <div class="text-center">
        <h1 class="text-3xl font-bold">{{ title }}</h1>
        <p class="text-base-content/70">Upcoming slots</p>
        <p class="text-sm text-base-content/60">Current user: {{ current_user_label }}</p>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
        {% for slot in slots %}
            {% include "slot_card.html" %}
        {% endfor %}
    </div>
</section>
