{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
{{ user_selector_html|safe }}
<div id="push-controls" data-user-id="{{ current_user_id.unwrap_or_default() }}" data-available="{{ push_available }}" hidden></div>
<section id="alert-setup" class="card alert-setup" aria-labelledby="alert-setup-title" hidden>
    <h2 id="alert-setup-title">{{ lang.text.alert_setup }}</h2>
    <p>{{ lang.text.alert_setup_help }}</p>
    <button type="button" id="enable-alerts" class="btn btn-secondary">{{ lang.text.enable_alerts }}</button>
    <p id="alert-setup-status" role="status" aria-live="polite"
        data-blocked="{{ lang.text.alerts_blocked }}" data-setting-up="{{ lang.text.setting_up_alerts }}"
        data-on="{{ lang.text.alert_on }}" data-failed="{{ lang.text.alerts_setup_failed }}"></p>
</section>
{% include "slots_content.html" %}
{% endblock %}
