name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust tools and Just
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo install just --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the complete local verification command
        run: just test-all
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures
          path: |
            test-results/
            tests/*.proptest-regressions
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: Container build
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image only after tests pass
        run: docker build --tag hoopline:verified .
