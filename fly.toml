app = "hoopline"
primary_region = "fra"

[build]

[env]
  DATABASE_URL = "sqlite:///data/hoopline.db"
  PORT = "5050"

[http_service]
  internal_port = 5050
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "hoopline_data"
  destination = "/data"
